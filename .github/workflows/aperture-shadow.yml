name: Aperture shadow authority

# DALEOBANKS had no CI. This is the minimum that proves something real:
# the organ runs against a BUILT ARTIFACT from a pinned Kernel commit, not
# against the Kernel source tree. A green run against source would prove
# nothing about deployability, so APERTURE_REQUIRE_INSTALLED=1 makes a
# source-path import a hard failure.

on:
  pull_request:
  push:
    branches: [main, "claude/**", "agent/**"]
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "uniimente-kernel ref to build the aperture from"
        required: false
        default: ""

env:
  # Pinned Kernel commit the aperture artifact is built from. Bump this
  # deliberately; a floating ref would make the run unreproducible.
  KERNEL_REF: "agent/canonical-authority-rc1"
  APERTURE_VERSION: "0.1.0"

jobs:
  shadow:
    name: "Shadow authority path (installed artifact)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: daleobanks

      - name: Check out the Kernel at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: dababiyoda/uniimente-kernel
          ref: ${{ github.event.inputs.kernel_ref || env.KERNEL_REF }}
          path: kernel

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record exact source commits
        run: |
          echo "daleobanks_commit=$(git -C daleobanks rev-parse HEAD)" >> $GITHUB_ENV
          echo "kernel_commit=$(git -C kernel rev-parse HEAD)" >> $GITHUB_ENV
          git -C daleobanks rev-parse HEAD
          git -C kernel rev-parse HEAD

      - name: Build the Reality Aperture distributions
        run: |
          python -m pip install --upgrade pip build
          python kernel/packaging/build_aperture.py
          ls -la kernel/dist

      - name: Install DALEOBANKS declared dependencies
        working-directory: daleobanks
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      # The organ installs the CLIENT. Not editable, not a path dependency.
      - name: Install the aperture client artifact
        run: pip install "kernel/dist/uniimente_aperture_client-${APERTURE_VERSION}-py3-none-any.whl"

      # Proved BEFORE the issuer is installed for fixture minting: in a
      # client-only environment the organ cannot reach issuer functionality
      # or the superseded legacy engine.
      - name: issuer-unreachable (client-only environment)
        working-directory: daleobanks
        env:
          APERTURE_REQUIRE_INSTALLED: "1"
        run: |
          python - <<'PY'
          import sys
          from governance.aperture_shadow import (aperture_origin,
                                                  assert_installed_artifact,
                                                  issuer_is_unreachable)
          assert_installed_artifact()
          origin = aperture_origin()
          assert "site-packages" in origin, f"source-path leakage: {origin}"
          assert issuer_is_unreachable(), "ORGAN CAN REACH THE ISSUER"
          for mod in ("policy.consequence_gate", "uniimente_kernel.gate",
                      "kernel.gate.pipeline"):
              try:
                  __import__(mod)
                  raise SystemExit(f"legacy authorizer reachable: {mod}")
              except ImportError:
                  pass
          print("client-only:", origin)
          print("issuer unreachable: True")
          print("legacy authorizers unreachable: True")
          PY

      - name: Verify no production credentials are present
        working-directory: daleobanks
        run: |
          python - <<'PY'
          from governance.aperture_shadow import (PRODUCTION_CREDENTIAL_VARS,
                                                  assert_no_production_credentials)
          assert_no_production_credentials()
          print("no production credentials:", list(PRODUCTION_CREDENTIAL_VARS))
          PY

      - name: Verify no production adapter can resolve
        working-directory: daleobanks
        run: |
          python - <<'PY'
          from governance.aperture_shadow import (FakePlatform, resolve_adapter,
                                                  ShadowConfigurationError)
          for bad in ("x-live", "twitter", "linkedin", "production"):
              try:
                  resolve_adapter(bad)
                  raise SystemExit(f"production adapter resolved: {bad}")
              except ShadowConfigurationError:
                  pass
          assert resolve_adapter(FakePlatform.adapter_id) is FakePlatform
          print("only reachable adapter:", FakePlatform.adapter_id)
          PY

      # Test-only. The organ RUNTIME never imports this; an AST test asserts so.
      - name: Install the issuer artifact (test-only, for minting fixtures)
        run: pip install "kernel/dist/uniimente_aperture_issuer-${APERTURE_VERSION}-py3-none-any.whl"

      - name: Run the shadow authority suite against the installed artifact
        working-directory: daleobanks
        env:
          APERTURE_REQUIRE_INSTALLED: "1"
        run: python -m pytest tests/test_aperture_shadow.py -v

      - name: Run the full DALEOBANKS suite
        working-directory: daleobanks
        continue-on-error: true
        run: python -m pytest -q --timeout=300 || echo "pre-existing suite status recorded, not gating the shadow path"

      - name: Record dependency and commit metadata
        working-directory: daleobanks
        run: |
          mkdir -p verification
          pip freeze > verification/DEPENDENCY_ENVIRONMENT.txt
          python - <<'PY'
          import json, os, hashlib, pathlib
          from governance.aperture_shadow import aperture_origin
          wheel = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "kernel" / "dist"
          arts = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in wheel.glob("*.whl")}
          json.dump({
              "daleobanks_commit": os.environ.get("daleobanks_commit"),
              "kernel_commit": os.environ.get("kernel_commit"),
              "aperture_version": os.environ.get("APERTURE_VERSION"),
              "aperture_origin": aperture_origin(),
              "artifact_hashes": arts,
              "python": os.sys.version,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
          }, open("verification/RUN_METADATA.json", "w"), indent=2)
          PY
          cat verification/RUN_METADATA.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-verification
          path: daleobanks/verification/
